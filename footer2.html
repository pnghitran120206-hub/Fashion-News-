<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Footer</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
 <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
             font-family: 'Playfair Display', serif;
  font-weight: 300;
           
  letter-spacing: 2px;
        }

        footer {
            background-color: Black;
            color: white;
            padding: 20px 20px;
        }

        .footer-container {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
}

.footer-column { width: 30%; margin-bottom: 20px; }

        .footer-column h3 {
            margin-bottom: 30px;
        }

        .footer-column ul {
            list-style: none;
            padding: 0;
        }

        .footer-column ul li {
            margin-bottom: 15px;
        }

        .footer-column ul li a {
            color: white;
            text-decoration: none;
        }

        .footer-column ul li a:hover {
            color: white;
        }
     
        .social-icons a {
            color: WHITE;
            margin-right: 15px;
            font-size: 20px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: #f1c40f;
        }

        .footer-bottom {
            text-align: center;
            border-top: 1px solid #444;
            margin-top: 20px;
            padding-top: 15px;
            font-size: 14px;
        }


        @media (max-width: 600px) {
            .footer-column {
                width: 100%;
            }

            .footer-container {
                flex-direction: column;
            }
             .social-icons a {
                margin-right: 10px;
            }
        }
    </style>
</head>

<body>

    <footer>
        <div class="footer-container">

       
            <div class="footer-column">

                <ul>

               <li><a href="#">Chính sách riêng tư</a></li> 
             
             <li><a href="#">Câu hỏi thường gặp</a></li>
        
               
            </div>

            <div class="footer-column">
                <h3>Danh mục</h3>
                <ul>
                    <li><a href="#">Trang chủ</a></li>

                    <li><a href="#">Sản phẩm</a></li>
                    <li><a href="#">Xu hướng</a></li>
                    <li><a href="#">thương hiệu</a></li>
                </ul>
            </div>

            <div class="footer-column">
                <h3>Liên hệ</h3>
                <p>Email: LUXÉA@gmail.com</p>
                <p>Phone: 099 999 999</p>
                <p>Instagram: @LUXÉA</p>
            </div>
             <div class="social-icons">
             <h4>@Follow us</h4>
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>

</div>
</div>

        </div>

     
        <div class="footer-bottom">

    </footer>

</body>
</html>
