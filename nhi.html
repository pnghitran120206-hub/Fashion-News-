 <!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Website With Login & Registration | Codehal   
</title>
<link rel="stylesheet" href="style.CSS">
</head>

<body>

<header>
	<h2 class="logo">LUXÉA</h2> 
<nav class="navigation">
<a href="/Fashion-News-/index.html">Trang chủ</a>
<a href="/Fashion-News-/cauhoithuonggap.html">Câu hỏi</a>
<a href="/Fashion-News-/chinhsachriengtu.html">chính sách</a>
<button class="btnLogin-popup" >Đăng ký</button>
</nav>
</header>

<div class="wrapper">
<span class="icon-close">
	<ion-icon name="close-sharp"></ion-icon>
</span>


<div class="form-box login">
	<h2 class="login">Đăng nhập</h2>
	<form action="#">
		<div class="input-box">
			<span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
			<input type="email" required>
			<label>Email</label>
	</div>

	<div class="input-box">
			<span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
			<input type="password" required>
			<label>Mật khẩu</label>
		</div>
		<div class="remember-forgot">
			<label><input type="checkbox">Nhớ mật khẩu</label>
			<a href="#">Quên mật khẩu?</a>
		</div>
		<button type="submit" class="btn">Đăng nhập</button>
		<div class="login-register">
			<p>Chưa có tài khoản?<a href="hi.html"
				class="register-link">Đăng ký</a></p>
			</div>

</form>
</div>




</div>

<script src="script.JS"></script>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
