<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Collection 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-gray-50">

    <header class="min-h-screen flex items-center justify-center p-4 md:p-10">
        <main class="w-full max-w-6xl flex flex-col md:flex-row overflow-hidden shadow-2xl bg-white">
           <section class="bg-[#BCAA8E] w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-between text-white">
    <div class="mb-12">
        <h1 class="serif text-5xl md:text-8xl leading-tight">
            Fashion <br> 
            <span class="italic font-light ml-4 md:ml-8">collection</span>
        </h1>
    </div>

    <div class="grid grid-cols-3 gap-4 mb-12">
        <div class="aspect-[2/3] bg-gray-200/20 overflow-hidden border-2 border-white/40 shadow-lg transition-transform hover:scale-105 duration-300">
            <img src="img/anh1.jpg" alt="Detail 1" class="w-full h-full object-cover">
        </div>
        <div class="aspect-[2/3] bg-gray-200/20 overflow-hidden border-2 border-white/40 shadow-lg transition-transform hover:scale-105 duration-300">
            <img src="img/anh2.jpg" alt="Detail 2" class="w-full h-full object-cover">
        </div>
        <div class="aspect-[2/3] bg-gray-200/20 overflow-hidden border-2 border-white/40 shadow-lg transition-transform hover:scale-105 duration-300">
            <img src="img/anh3.jpg" alt="Detail 3" class="w-full h-full object-cover">
        </div>
    </div>

    </div>
</section>

<section class="relative w-full md:w-1/2 h-[500px] md:h-auto overflow-hidden">
    <img src="img/anh4.jpg" alt="Hero Model" class="w-full h-full object-cover">
    ...
</section>
        </main>
    </header>

  <section id="collection" class="pt-32 pb-20 px-6 max-w-7xl mx-auto">
    <div class="flex items-center gap-4 mb-16">
        <div class="h-[1px] flex-1 bg-gray-200"></div>
        <h2 class="serif text-3xl md:text-4xl uppercase tracking-[0.2em] text-gray-800">Bộ Sưu Tập</h2>
        <div class="h-[1px] flex-1 bg-gray-200"></div>
    </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="relative group cursor-pointer overflow-hidden">
                <img src="img/xuanhe1.jpg" class="w-full h-[500px] object-contain transition-transform duration-1000 group-hover:scale-110" alt="Xuân Hè">
                <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                    <h3 class="serif text-white text-4xl uppercase tracking-widest border-b border-white pb-2">Xuân Hè</h3>
                </div>
            </div>
            <div class="relative group cursor-pointer overflow-hidden">
                <img src="img/thudong1.jpg" class="w-full h-[500px] object-contain transition-transform duration-1000 group-hover:scale-110" alt="Thu Đông">
                <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                    <h3 class="serif text-white text-4xl uppercase tracking-widest border-b border-white pb-2">Thu Đông</h3>
                </div>
            </div>
        </div>
    </section>

    <section class="py-24 px-6 bg-white border-y border-gray-100">
        <div class="max-w-7xl mx-auto">
            <div class="flex items-center gap-4 mb-16">
                <div class="h-[1px] flex-1 bg-gray-200"></div>
                <h2 class="serif text-3xl uppercase tracking-[0.2em]">Fashion Week</h2>
                <div class="h-[1px] flex-1 bg-gray-200"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <img src="img/fashionweek1.jpg" class="w-full h-[600px] object-cover hover:grayscale transition duration-500" alt="Runway 1">
                <div class="flex flex-col gap-6">
                    <img src="img/fashionweek2.jpg"  class="w-full h-[288px] object-cover" alt="Runway 2">
                    <img src="img/fashionweek3.jpg"  class="w-full h-[288px] object-cover" alt="Runway 3">
                </div>
                <img src="img/fashionweek4.jpg"  class="w-full h-[600px] object-cover hover:grayscale transition duration-500" alt="Runway 4">
            </div>
        </div>
   <section class="py-24 px-6 max-w-7xl mx-auto">
    <div class="flex items-center gap-6 mb-16">
        <div class="h-[1px] flex-1 bg-gray-200"></div>
        <h2 class="serif text-2xl md:text-3xl uppercase tracking-[0.3em]">Trang sức & Phụ kiện</h2>
        <div class="h-[1px] flex-1 bg-gray-200"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="text-center group">
            <div class="bg-[#f9f9f9] mb-6 overflow-hidden aspect-[3/4] flex items-center justify-center transition-all group-hover:shadow-xl">
                <img src="img/bag.jpg" alt="Designer Bag" class="w-full h-full object-cover transition duration-700 group-hover:scale-110">
            </div>
            <h4 class="serif text-lg mb-1">Designer Bag</h4>
            <div class="h-px w-8 bg-gray-300 mx-auto mt-2"></div>
        </div>

        <div class="text-center group">
            <div class="bg-[#f9f9f9] mb-6 overflow-hidden aspect-[3/4] flex items-center justify-center transition-all group-hover:shadow-xl">
                <img src="img/kinh.jpg" alt="Chic Sunglasses" class="w-full h-full object-cover transition duration-700 group-hover:scale-110">
            </div>
            <h4 class="serif text-lg mb-1">Chic Sunglasses</h4>
            <div class="h-px w-8 bg-gray-300 mx-auto mt-2"></div>
        </div>

        <div class="text-center group">
            <div class="bg-[#f9f9f9] mb-6 overflow-hidden aspect-[3/4] flex items-center justify-center transition-all group-hover:shadow-xl">
                <img src="img/jewelry.jpg" alt="Elegant Jewelry" class="w-full h-full object-cover transition duration-700 group-hover:scale-110">
            </div>
            <h4 class="serif text-lg mb-1">Elegant Jewelry</h4>
            <div class="h-px w-8 bg-gray-300 mx-auto mt-2"></div>
        </div>
    </div>
</section>

    <footer class="bg-[#BCAA8E] text-white py-16 text-center">
        <div class="flex justify-center gap-10 text-[11px] uppercase tracking-[0.3em] mb-8 text-gray-400">
            <a href="#" class="hover:text-white transition-colors">Contact</a>
            <a href="#" class="hover:text-white transition-colors">Instagram</a>
            <a href="#" class="hover:text-white transition-colors">Facebook</a>
        </div>
        <div class="h-px w-20 bg-gray-700 mx-auto mb-8"></div>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest">© 2026 Wanderful Studio</p>
    </footer>

</body>
</html>
