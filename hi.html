 <!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Website With Login & Registration | Codehal   
</title>
<link rel="stylesheet" href="style.CSS">
</head>

<body>
	<header>
	<h2>LUXÉA</h2> 
<nav class="navigation">
<a href="/Fashion-News-/index.html">Trang chủ</a>
<a href="/Fashion-News-/cauhoithuonggap.html">Câu hỏi</a>
<a href="/Fashion-News-/chinhsachriengtu.html">Chính sách</a>
<button class="btnLogin-popup" href="/Fashion-News-/nhi.html">Đăng nhập</button>
</nav>
</header>

<div class="wrapper">
<span class="icon-close">
	<ion-icon name="close-sharp"></ion-icon>
</span>


<div class="form-box register">
	<h2>Đăng ký</h2>
	<form action="#">
		<div class="input-box">
			<span class="icon">
				<ion-icon name="person-outline"></ion-icon>
			</span>
			<input type="text" required>
			<label>Họ và tên</label>
	</div>
		<div class="input-box">
			<span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
			<input type="email" required>
			<label>Email</label>
	</div>

	<div class="input-box">
			<span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
			<input type="password" required>
			<label>Mật khẩu</label>
		</div>
		<div class="remember-forgot">
			<label><input type="checkbox">Tôi đồng ý với các chính sách và điều khoản</label>
		</div>
		<button type="submit" class="btn">Đăng ký</button>
		<div class="login-register">
			<p>Đã có tài khoản?<a href="nhi.html"
				class="Login-link">Đăng nhập</a></p>
			</div>

</form>
</div>


</div>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
