<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Lookbook - Fashion Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .serif { font-family: 'Playfair Display', serif; }
        .sans { font-family: 'Inter', sans-serif; }
        body { background-color: #fff; color: #1a1a1a; }
    </style>
</head>
<body class="sans">
<section class="relative grid grid-cols-1 md:grid-cols-2 min-h-screen overflow-hidden">
    <div class="relative h-[50vh] md:h-screen border-r border-white">
        <img src="img/xuanhe1.jpg" class="w-full h-full object-cover" alt="Fashion 1">
    </div>

    <div class="relative h-[50vh] md:h-screen bg-[#f2f2f2]">
        <img src="img/xuanhe2.jpg" class="w-full h-full object-cover" alt="Fashion 2">
    </div>

    <div class="absolute inset-0 z-10 flex flex-col justify-center items-center text-center text-white pointer-events-none">
        <div class="pointer-events-auto">
            <h1 class="serif text-4xl md:text-7xl uppercase tracking-[0.2em] mb-6 drop-shadow-lg">
                SPRING / SUMMER <br> 2026
            </h1>
            <button class="border border-white bg-black/10 backdrop-blur-sm px-10 py-4 text-xs uppercase tracking-widest hover:bg-white hover:text-black transition-all duration-300">
                EXPLORE NOW
            </button>
        </div>
    </div>
</section>

    <section class="py-12 border-b overflow-hidden">
        <div class="flex justify-around items-center opacity-50 grayscale gap-8 px-10">
            <span class="font-black text-xl">NYLON</span>
            <span class="font-black text-xl">ELLE</span>
            <span class="font-black text-xl">VOGUE</span>
            <span class="font-black text-xl">HUNGER</span>
            <span class="font-black text-xl">Forbes</span>
        </div>
    </section>

    <section class="max-w-7xl mx-auto py-24 px-6">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-10 items-center">
            <div class="md:col-span-4 aspect-[3/4] overflow-hidden bg-gray-100 shadow-sm">
                <img src="img/XH3.jpg" class="w-full h-full object-cover" alt="">
            </div>
            <div class="md:col-span-3 aspect-square overflow-hidden bg-gray-100 mt-12">
                <img src="img/XH4.jpg" class="w-full h-full object-cover" alt="">
            </div>
            <div class="md:col-span-5 pl-10">
                <h3 class="serif text-4xl uppercase mb-6 leading-tight">Milano <br> Design Week</h3>
                <p class="text-sm text-gray-500 leading-relaxed mb-8 max-w-sm">
                    Khám phá sự kết hợp giữa nét cổ điển và hơi thở hiện đại trong bộ sưu tập mới nhất tại tuần lễ thời trang.
                </p>
                <a href="#" class="text-[10px] uppercase tracking-[0.3em] font-bold border-b border-black pb-2">Discover Collection</a>
            </div>
        </div>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-3">
        <div class="aspect-[3/4] overflow-hidden relative group">
            <img src="img/XH5.jpg" class="w-full h-full object-cover transition duration-700 group-hover:scale-105" alt="">
        </div>
        <div class="aspect-[3/4] overflow-hidden relative group border-x border-white">
            <img src="img/XH7.jpg" class="w-full h-full object-cover transition duration-700 group-hover:scale-105" alt="">
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <span class="serif text-white/80 text-4xl uppercase tracking-tighter -rotate-90">Feminine Individuality</span>
            </div>
        </div>
        <div class="aspect-[3/4] overflow-hidden relative group">
            <img src="img/XH6.jpg" class="w-full h-full object-cover transition duration-700 group-hover:scale-105" alt="">
        </div>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-2 gap-px bg-white py-20">
        <div class="relative p-10 flex flex-col items-center">
            <img src="img/XH8.jpg" class="w-full aspect-square object-cover mb-8" alt="">
            
        </div>
        <div class="relative p-10 flex flex-col items-center">
            <img src="img/XH9.jpg" class="w-full aspect-square object-cover mb-8" alt="">
        </div>
    </section>

</body>
</html>
